packages:
  - frontend

# One version per dependency for the whole repo, as in the smartlab monorepo
catalog:
  vue: ^3.5.45
  vue-router: ^5.5.1
  '@tsconfig/node24': ^24.0.6
  '@types/jsdom': ^30.0.0
  '@types/node': ^24.19.2
  '@vitejs/plugin-vue': ^6.0.11
  '@vitest/eslint-plugin': ^1.6.28
  '@vue/eslint-config-typescript': ^14.9.0
  '@vue/test-utils': ^2.5.1
  '@vue/tsconfig': ^0.9.1
  cypress: ^16.3.0
  eslint: ^10.15.0
  eslint-plugin-cypress: ^7.0.5
  eslint-plugin-vue: ~10.11.0
  jiti: ^2.7.0
  jsdom: ^30.1.3
  start-server-and-test: ^3.0.13
  typescript: ~6.0.0
  vite: ^8.3.8
  vitest: ^4.1.12
  vue-eslint-parser: ^10.4.2
  vue-tsc: ^3.3.14

# Packages allowed to run install scripts (cypress downloads its binary)
onlyBuiltDependencies:
  - cypress
