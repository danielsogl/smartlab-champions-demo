# Tier 3: everything too slow for the inner loop.
# Runs on main and, as build validation in the main branch policy, on every PR.
trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

jobs:
  - job: backend
    steps:
      - task: JavaToolInstaller@0
        inputs: { versionSpec: '25', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
      - script: ./mvnw -B -pl backend verify

  - job: frontend
    steps:
      - task: UseNode@1
        inputs: { version: '24.x' }
      - script: npm ci && npm run lint && npm run test:unit
        workingDirectory: frontend

  - job: e2e
    dependsOn: [backend, frontend]
    steps:
      - task: JavaToolInstaller@0
        inputs: { versionSpec: '25', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
      - task: UseNode@1
        inputs: { version: '24.x' }
      - script: ./mvnw -B -q -pl backend package -DskipTests
      - script: java -jar backend/target/backend-0.0.1-SNAPSHOT.jar &
      - script: npm ci && npx cypress install && npm run build && npm run test:e2e
        workingDirectory: frontend
